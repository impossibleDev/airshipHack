<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airship PvP</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <form id="join-screen">
      <input id="pilot-name" maxlength="18" placeholder="Pilot name" required>
      <input id="invite-code" maxlength="6" placeholder="Team code (optional)">
      <button>Join game</button>
      <span id="join-error"></span>
    </form>
    <header id="team-banner"></header>
    <aside id="build-menu"><strong>BUILD · F</strong><div id="tile-options"></div></aside>
    <aside id="leaderboard"><strong>CREWS</strong><div id="leaderboard-list"></div></aside>
    <footer id="status-bar"></footer>
    <div id="toast"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
